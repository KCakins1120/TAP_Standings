name: Update Standings

on:
  schedule:
    # 14:00 UTC = 9:00 AM CT (CDT) / adjust to 15:00 UTC Nov–Mar for CST
    - cron: "0 14 * * *"
  workflow_dispatch:  # allows manual trigger from Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Run scraper
        run: python scraper/scrape.py

      - name: Commit updated data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/data.json
          git diff --cached --quiet || git commit -m "chore: update standings $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push origin HEAD
