name: Update data and deploy site

on:
  schedule:
    - cron: "0 14 * * *"   # 9:00 AM CT (CDT = 14:00 UTC, CST = 15:00 UTC)
  workflow_dispatch:         # Actions tab > Run workflow (manual trigger)
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install scraper dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Fetch standings for all sports
        run: python scraper/scrape.py --out docs/data.json

      - name: Commit data.json if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          if git diff --cached --quiet; then
            echo "data.json unchanged"
            exit 0
          fi
          git commit -m "chore: update multi-sport standings $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for attempt in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push && exit 0
            echo "Push failed (attempt $attempt), retrying..."
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          exit 1

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs            # serves docs/ folder directly — no Jekyll build

      - id: deployment
        uses: actions/deploy-pages@v4
