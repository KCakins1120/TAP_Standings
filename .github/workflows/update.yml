name: Update Standings

on:
  schedule:
    # 14:00 UTC = 9:00 AM CT (CDT). In CST (Nov–Mar) this becomes 8:00 AM CT.
    # Change to "0 15 * * *" between November and March if you want strict 9am CST.
    - cron: "0 14 * * *"
  workflow_dispatch: # allows manual trigger from the Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Fetch standings
        run: python scraper/scrape.py

      - name: Commit updated data.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/data.json
          git diff --cached --quiet || git commit -m "chore: update standings $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: false
