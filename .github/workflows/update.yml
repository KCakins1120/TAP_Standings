name: Update Standings

on:
  schedule:
    # 14:00 UTC = 9:00 AM CT (CDT) / adjust to 15:00 UTC Nov–Mar for CST
    - cron: "0 14 * * *"
  workflow_dispatch:  # allows manual trigger from Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install system dependencies for Playwright
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libdrm2 \
            libxkbcommon0 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            libgbm1 \
            libasound2t64 \
            libpango-1.0-0 \
            libcairo2

      - name: Install Playwright Chromium
        run: playwright install chromium

      - name: Run scraper
        run: python scraper/scrape.py

      - name: Commit updated data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/data.json
          git diff --cached --quiet || git commit -m "chore: update standings $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push origin HEAD
