<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Summit League Women's Volleyball Standings</title>
  <style>
    :root {
      --primary: #003087;
      --accent:  #c8a84b;
      --bg:      #f4f6f9;
      --card:    #ffffff;
      --text:    #1a1a2e;
      --muted:   #6b7280;
      --border:  #e2e8f0;
      --stale:   #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    header {
      background: var(--primary);
      color: #fff;
      padding: 1.5rem 2rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      box-shadow: 0 2px 8px rgba(0,0,0,.25);
    }

    header h1 {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: .02em;
    }

    header span.season {
      background: var(--accent);
      color: #000;
      font-size: .75rem;
      font-weight: 700;
      padding: .2rem .6rem;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: .05em;
    }

    main {
      max-width: 1100px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    .meta-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      flex-wrap: wrap;
      gap: .5rem;
    }

    .meta-bar .updated {
      font-size: .8rem;
      color: var(--muted);
    }

    .stale-badge {
      display: none;
      background: var(--stale);
      color: #000;
      font-size: .75rem;
      font-weight: 700;
      padding: .25rem .75rem;
      border-radius: 999px;
    }

    .stale-badge.visible { display: inline-block; }

    .card {
      background: var(--card);
      border-radius: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
      overflow: hidden;
    }

    .card-header {
      background: var(--primary);
      color: #fff;
      padding: .75rem 1.25rem;
      font-size: .9rem;
      font-weight: 600;
      letter-spacing: .03em;
      text-transform: uppercase;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: .85rem;
    }

    thead th {
      background: #eef2f7;
      color: var(--primary);
      font-weight: 700;
      padding: .65rem .9rem;
      text-align: center;
      border-bottom: 2px solid var(--border);
      white-space: nowrap;
    }

    thead th:first-child { text-align: left; }

    tbody tr:nth-child(even) { background: #f8fafc; }

    tbody tr:hover { background: #eef4ff; }

    tbody td {
      padding: .6rem .9rem;
      border-bottom: 1px solid var(--border);
      text-align: center;
      white-space: nowrap;
    }

    tbody td:first-child {
      text-align: left;
      font-weight: 600;
      color: var(--primary);
    }

    .loading, .error {
      padding: 2rem;
      text-align: center;
      color: var(--muted);
      font-size: .95rem;
    }

    .error { color: #dc2626; }

    footer {
      text-align: center;
      padding: 2rem 1rem;
      font-size: .75rem;
      color: var(--muted);
    }

    footer a { color: var(--primary); text-decoration: none; }
    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>

<header>
  <h1>🏐 Summit League Women's Volleyball Standings</h1>
  <span class="season">2026</span>
</header>

<main>
  <div class="meta-bar">
    <span class="updated" id="updated-at">Loading…</span>
    <span class="stale-badge" id="stale-badge">⚠️ Data may be stale</span>
  </div>

  <div class="card">
    <div class="card-header">Conference Standings</div>
    <div class="table-wrap">
      <div class="loading" id="loading">Fetching standings…</div>
      <table id="standings-table" style="display:none;">
        <thead id="thead"></thead>
        <tbody id="tbody"></tbody>
      </table>
      <div class="error" id="error" style="display:none;">
        Unable to load standings. Please try again later.
      </div>
    </div>
  </div>
</main>

<footer>
  Data sourced from <a href="https://thesummitleague.org/standings.aspx?path=wvball" target="_blank">thesummitleague.org</a>.
  Updated automatically every morning at 9 AM CT.
  &nbsp;|&nbsp;
  <a href="https://github.com/KCakins1120/TAP_Standings" target="_blank">View on GitHub</a>
</footer>

<script>
  async function loadStandings() {
    const loading  = document.getElementById("loading");
    const errorDiv = document.getElementById("error");
    const table    = document.getElementById("standings-table");
    const thead    = document.getElementById("thead");
    const tbody    = document.getElementById("tbody");
    const updatedEl = document.getElementById("updated-at");
    const staleBadge = document.getElementById("stale-badge");

    try {
      const res  = await fetch("data.json?nocache=" + Date.now());
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      const s    = data.standings;

      if (!s || !s.headers || !s.rows || s.rows.length === 0) {
        throw new Error("No standings data available.");
      }

      // Updated timestamp
      if (s.updated_at) {
        const d = new Date(s.updated_at);
        updatedEl.textContent = "Last updated: " + d.toLocaleString("en-US", {
          timeZone: "America/Chicago",
          dateStyle: "medium",
          timeStyle: "short"
        }) + " CT";
      }

      // Stale warning
      if (s.status === "stale") {
        staleBadge.classList.add("visible");
      }

      // Build header row
      const headerRow = document.createElement("tr");
      s.headers.forEach(h => {
        const th = document.createElement("th");
        th.textContent = h;
        headerRow.appendChild(th);
      });
      thead.appendChild(headerRow);

      // Build data rows
      s.rows.forEach(row => {
        const tr = document.createElement("tr");
        row.forEach(cell => {
          const td = document.createElement("td");
          td.textContent = cell;
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });

      loading.style.display = "none";
      table.style.display   = "table";

    } catch (err) {
      console.error(err);
      loading.style.display = "none";
      errorDiv.style.display = "block";
      updatedEl.textContent  = "Could not load data.";
    }
  }

  loadStandings();
</script>

</body>
</html>
